<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + user-scalable=no: comportamento de app nativo no iOS -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finanças" />
    <meta name="theme-color" content="#e8e0f0" />
    <meta name="description" content="Controle de finanças pessoais offline-first." />
    <meta name="format-detection" content="telephone=no" />

    <title>Finanças</title>

    <link rel="manifest" href="/financas/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/financas/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/financas/icons/apple-touch-icon.png" />

    <!-- Fontes self-hosted: sem elas o primeiro carregamento offline quebraria. -->
    <link
      rel="preload"
      href="/financas/fonts/dm-sans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/financas/fonts/dm-sans-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
