name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  # permite disparar manualmente pela aba Actions
  workflow_dispatch:
  # chamado pelo workflow do mercado: um commit feito com o GITHUB_TOKEN não
  # dispara outros workflows por push (proteção contra laço infinito), então
  # a publicação precisa ser invocada explicitamente.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; pushes novos cancelam builds em andamento.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Impedir publicação sem index.html
        run: test -f dist/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
